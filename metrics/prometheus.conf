global:
   scrape_interval: 1m
   scrape_timeout:  10s
   evaluation_interval: 1m

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yml"

scrape_configs:
   - job_name: 'prometheus'
     scheme: http
     static_configs:
        - targets: ['localhost:9090']

   - job_name: 'cadvisor'
     scheme: http
     static_configs:
        - targets: ['cadvisor:8080']

   - job_name: 'node-exporter'
     static_configs:
        - targets: ['node-exporter:9100']
