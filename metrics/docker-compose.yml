services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.conf:/prometheus.conf:ro
      - ./prometheus_data:/prometheus
    command:
      - '--config.file=/prometheus.conf'
      - '--storage.tsdb.path=/prometheus/data'
      - '--storage.tsdb.retention.time=5d'
    networks:
      - monitoring
    depends_on:
      - cadvisor
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_date:
    driver: local
