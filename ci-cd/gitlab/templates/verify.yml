verify:
  stage: verify
  image: docker:27-cli
  needs: [deploy]
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache bash curl
  script:
    - |
      if [ -f "$PROD_DIR/.last_good_sha" ]; then
        cp "$PROD_DIR/.last_good_sha" "$PROD_DIR/.previous_sha"
      fi
    - |
      cd "$PROD_DIR"
      sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${CI_COMMIT_SHORT_SHA}|" .env || echo "IMAGE_TAG=${CI_COMMIT_SHORT_SHA}" >> .env
      docker compose -p identidock-prod pull identidock
      docker compose -p identidock-prod up -d --no-build identidock
    - sleep 15
    - |
      CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_HEALTHCHECK_URL" || echo "000")
      if [ "$CODE" != "200" ]; then
        echo "Healthcheck failed, HTTP $CODE"
        exit 1
      fi
      echo "Healthcheck OK"
      echo "$CI_COMMIT_SHORT_SHA" > "$PROD_DIR/.last_good_sha"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
