build:
  stage: build
  image: docker:27-cli
  script:
    - docker build --dns 77.88.8.8 --dns 77.88.8.1 --no-cache -t identidock:$CI_COMMIT_SHORT_SHA -t identidock:newest -f identidock/Dockerfile identidock/
    - docker image inspect identidock:$CI_COMMIT_SHORT_SHA >/dev/null
    - echo "✅ Built identidock:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
