rollback:
  stage: rollback
  image: docker:27-cli
  needs: [verify]
  when: on_failure
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache bash curl
  script:
    - |
      PREV=$(cat "$PROD_DIR/.previous_sha" 2>/dev/null || echo "")
      if [ -z "$PREV" ]; then
        echo "No previous SHA to rollback to"
        exit 1
      fi
      echo "Rolling back to $PREV"
    - |
      cd "$PROD_DIR"
      sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREV}|" .env
      docker compose -p identidock-prod pull identidock
      docker compose -p identidock-prod up -d --no-build identidock
    - sleep 15
    - |
      CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_HEALTHCHECK_URL" || echo "000")
      if [ "$CODE" = "200" ]; then
        echo "Rollback successful"
        echo "$PREV" > "$PROD_DIR/.last_good_sha"
      else
        echo "Prod is still broken, HTTP $CODE"
        exit 1
      fi
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d text="Rollback executed. From ${CI_COMMIT_SHORT_SHA} to ${PREV}" \
        || echo "Telegram unreachable"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
