rollback:
  stage: rollback
  image: docker:27-cli
  needs: 
    - job: verify
      optional: true
  when: on_failure
  before_script:
    - apk add --no-cache bash curl
  script:
    - |
      PREV=$(cat "$PROD_DIR/.previous_sha" 2>/dev/null || echo "")
      if [ -z "$PREV" ]; then
        echo "WARNING: No previous SHA to rollback to. This is the first deployment."
        exit 0
      fi
      echo "Rolling back to $PREV"
    - |
      sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREV}|" "$PROD_DIR/.env"
      docker compose -p identidock-prod -f $CI_PROJECT_DIR/ci-cd/gitlab/prod/docker-compose.yml --env-file "$PROD_DIR/.env" up -d --pull always identidock
    - sleep 15
    - |
      NGINX_HOST=$(grep '^NGINX_HOST=' "$PROD_DIR/.env" | cut -d '=' -f 2)
      echo "Checking health at http://$NGINX_HOST/healthz"
      
      CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$NGINX_HOST/healthz" || echo "000")
      if [ "$CODE" = "200" ]; then
        echo "Rollback successful"
        echo "$PREV" > "$PROD_DIR/.last_good_sha"
      else
        echo "Prod is still broken, HTTP $CODE"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
