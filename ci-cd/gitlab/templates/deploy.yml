deploy:
  stage: deploy
  image: docker:27-cli
  variables:
    DEPLOY_TAG: "newest"
  before_script:
    - apk add --no-cache bash
  script:
    - echo "Deploying tag $DEPLOY_TAG for commit $CI_COMMIT_SHORT_SHA"
    - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    
    # 1. Тегируем образ
    - docker tag $LOCAL_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKERHUB_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $LOCAL_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKERHUB_IMAGE:$DEPLOY_TAG
    
    # 2. Пушим в Docker Hub (вместе с Inline Cache)
    - docker push $DOCKERHUB_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKERHUB_IMAGE:$DEPLOY_TAG
    
    # 3. Обновляем .env на сервере
    - |
      sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${CI_COMMIT_SHORT_SHA}|" "$PROD_DIR/.env" || echo "IMAGE_TAG=${CI_COMMIT_SHORT_SHA}" >> "$PROD_DIR/.env"
    
    # 4. Удаляем старые контейнеры, чтобы они не мешали (лечит "мертвые" контейнеры после ребута)
    - docker rm -f prod-identidock identidock-prod-proxy-1 2>/dev/null || true
    
    # 5. Принудительно пересоздаем app и proxy
    - |
      docker compose -p identidock-prod \
        -f $CI_PROJECT_DIR/ci-cd/gitlab/prod/docker-compose.yml \
        --env-file "$PROD_DIR/.env" \
        up -d --force-recreate identidock proxy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
