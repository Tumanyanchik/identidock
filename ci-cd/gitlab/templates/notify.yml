# ─── Базовый шаблон отправки в Telegram ────────────────────────
.telegram_send:
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache bash curl jq
    - |
      if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
        echo "⚠ TELEGRAM_TOKEN или TELEGRAM_CHAT_ID не заданы — пропускаю уведомление"
        exit 0
      fi

# ─── Уведомление об успехе ─────────────────────────────────────
notify_success:
  extends: .telegram_send
  stage: notify
  when: on_success
  allow_failure: true
  script:
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d parse_mode="Markdown" \
        -d text="✅ *Pipeline #${CI_PIPELINE_ID}* прошёл успешно
      📦 Проект: \`${CI_PROJECT_PATH}\`
      🌿 Ветка: \`${CI_COMMIT_BRANCH}\`
      👤 Автор: ${GITLAB_USER_NAME}
      💬 Коммит: \`${CI_COMMIT_SHORT_SHA}\` — ${CI_COMMIT_TITLE}
      🔗 [Открыть пайплайн](${CI_PIPELINE_URL})" \
        || echo "⚠ Telegram недоступен (curl exit $?)"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Уведомление об ошибке ─────────────────────────────────────
notify_failure:
  extends: .telegram_send
  stage: notify
  when: on_failure
  allow_failure: true
  script:
    - |
      # 1. Узнаем имя упавшей джобы (с защитой от падения curl)
      FAILED_JOB="unknown"
      if [ -n "$GITLAB_API_TOKEN" ]; then
        # Флаг -4 (IPv4), таймаут 5 сек, и || echo "[]" на случай если API недоступен
        JOB_INFO=$(curl -4 -s --connect-timeout 5 --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs?scope=failed" || echo "[]")
        
        # Извлекаем имя джобы. Если ничего не нашли, jq вернет "null", мы его заменим на "unknown"
        PARSED_NAME=$(echo "$JOB_INFO" | jq -r '.[0].name // "unknown"')
        if [ -n "$PARSED_NAME" ] && [ "$PARSED_NAME" != "null" ]; then
          FAILED_JOB="$PARSED_NAME"
        fi
      fi
      
      echo "Упавшая джоба: $FAILED_JOB"
      echo "Отправляем сообщение в Telegram..."
      
      # 2. Отправляем сообщение в Telegram
      curl -4 -s --connect-timeout 5 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d parse_mode="Markdown" \
        -d text="❌ *Pipeline #${CI_PIPELINE_ID}* упал
      🛠 Упавшая джоба: *${FAILED_JOB}*
      📦 Проект: \`${CI_PROJECT_PATH}\`
      🌿 Ветка: \`${CI_COMMIT_BRANCH}\`
      👤 Автор: ${GITLAB_USER_NAME}
      💬 Коммит: \`${CI_COMMIT_SHORT_SHA}\` — ${CI_COMMIT_TITLE}
      🔗 [Открыть пайплайн](${CI_PIPELINE_URL})" \
        || echo "⚠ Telegram недоступен (curl exit $?)"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
