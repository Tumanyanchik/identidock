name: review-${CI_COMMIT_REF_SLUG}

services:
  identidock:
    image: ${DOCKERHUB_IMAGE}:${IMAGE_TAG}
    container_name: review-${CI_COMMIT_REF_SLUG}-identidock
    environment:
      ENV: DEV
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    image: postgres:15
    container_name: review-${CI_COMMIT_REF_SLUG}-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - review_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: proxy:1.0
    container_name: review-${CI_COMMIT_REF_SLUG}-proxy
    ports:
      - "${REVIEW_PORT}:80"
    environment:
      NGINX_HOST: localhost
      NGINX_PROXY: http://identidock:9090
    depends_on:
      - identidock

volumes:
  review_pg_data:
