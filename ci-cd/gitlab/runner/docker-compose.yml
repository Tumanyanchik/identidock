services:
  gitlab-runner:
    build: .
    image: identidock-gitlab-runner:1.0
    container_name: gitlab-runner
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

    # --- ОГРАНИЧЕНИЯ РЕСУРСОВ ДЛЯ САМОГО РАННЕРА ---
    deploy:
      resources:
        limits:
          cpus: '1.0'      # Оставляем 1 ядро для раннера
          memory: 1G       # И 1 ГБ памяти (остальное пойдет задачам и системе)
    # Дублируем для совместимости
    mem_limit: 1g
    cpus: 1.0
    # -----------------------------------------------

    networks:
      - gitlab-net

volumes:
  gitlab-runner-config:

networks:
  gitlab-net:
    name: gitlab-net
    external: true
