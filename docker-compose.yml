services:
    proxy:
       image: proxy:1.0
       links:
          - identidock
       ports:
          - "80:80"
       environment:
          - NGINX_HOST=${NGINX_HOST}
          - NGINX_PROXY=${NGINX_PROXY}
       deploy:
          resources:
             limits:
                memory: 128M
             reservations:
                memory: 64M    
    
    identidock:
       extends:
          file: common.yml
          service: identidock
       environment:
          ENV: ${ENV}
          SECRET_KEY: ${SECRET_KEY}
          DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
       depends_on:
          postgresql:
             condition: service_healthy
       deploy:
          resources:
             limits:
                memory: 256M
             reservations:
                memory: 64M
    
    postgresql:
       image: postgres:15
       environment:
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_DB: ${POSTGRES_DB}
       volumes:
          - postgres_data:/var/lib/postgresql/data
       healthcheck:
          test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
          interval: 5s
          timeout: 3s
          retries: 10
       deploy:
          resources:
             limits:
                memory: 256M
             reservations:
                memory: 128M

    dnmonster:
       extends:
          file: common.yml
          service: dnmonster 
       deploy:
         resources:
            limits:
               memory: 128M
            reservations:
               memory: 64M

    redis:
       extends:
          file: common.yml
          service: redis
       volumes:
          - redis_data:/data
       command: >
          redis-server --appendonly yes --appendfsync everysec
          --save 900 1 --save 300 10 --save 60 10000
          --maxmemory 256mb --maxmemory-policy volatile-lru
       deploy:
          resources:
             limits:
                memory: 128M
             reservations:
                memory: 64M

volumes:
  redis_data:
  postgres_data:
