stages:
  - lint
  - build
  - test
  - deploy
  - verify
  - rollback
  - notify

include:
  - local: 'ci-cd/gitlab/templates/lint.yml'
  - local: 'ci-cd/gitlab/templates/build.yml'
  - local: 'ci-cd/gitlab/templates/test.yml'
  - local: 'ci-cd/gitlab/templates/deploy.yml'
  - local: 'ci-cd/gitlab/templates/verify.yml'
  - local: 'ci-cd/gitlab/templates/rollback.yml'
  - local: 'ci-cd/gitlab/templates/notify.yml'

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  COMPOSE_FILE: docker-compose.yml
  COMPOSE_PROJECT: identidock-ci-$CI_PIPELINE_ID
  LOCAL_IMAGE: identidock
  DOCKERHUB_IMAGE: tumanyan/identidock
  NGINX_HOST: localhost
  NGINX_PROXY: identidock

default:
  interruptible: true
  tags:
    - identidock
