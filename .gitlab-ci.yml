stages:
  - lint
  - build
  - test
  - deploy

include:
  - local: 'ci-cd/gitlab/templates/lint.yml'
  - local: 'ci-cd/gitlab/templates/build.yml'
  - local: 'ci-cd/gitlab/templates/test.yml'
  - local: 'ci-cd/gitlab/templates/deploy.yml'

variables:
  # Общие переменные для всех job'ов. Реальные секреты — в GitLab CI/CD Variables.
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/identidock
